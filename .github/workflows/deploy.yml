# BravoGov owns this release-image pipeline. It does not deploy to GOV.UH.
# The existing E01 shared production release process selects a verified digest
# only after real Signon, virus scanning, asset preservation and rollback checks.
name: Build UH Asset Manager release image

on:
  workflow_dispatch:

run-name: Package UH Asset Manager source ${{ github.sha }}

permissions:
  contents: read
  packages: write

concurrency:
  group: uh-asset-manager-release-image
  cancel-in-progress: false

jobs:
  build-release-image:
    name: Package verified source for the existing AMD64 server
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the actual BravoGov repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up reproducible Docker builder
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to BravoGov GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the original AMD64 application with ClamAV
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.uh-amd64-runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bravogov/asset-manager:sha-${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Record immutable image digest
        env:
          SHA: ${{ github.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          {
            echo "## BravoGov Asset Manager image"
            echo "Source: \`$SHA\`"
            echo "Registry: \`ghcr.io/bravogov/asset-manager\`"
            echo "Digest: \`$DIGEST\`"
            echo
            echo "This is a source-controlled image package, NOT a production deployment."
          } >> "$GITHUB_STEP_SUMMARY"
